# ============================================
# PREFIX & BASIC SETTINGS
# ============================================
# Use Ctrl+a instead of Ctrl+b (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Performance improvements
set -g escape-time 10           # Faster command sequences (default is 500ms)
set -g focus-events on          # Enable focus events for better terminal integration
set -g history-limit 50000      # Increase scrollback buffer (default is 2000)
set -g display-time 4000        # Display messages for 4 seconds
set -g status-interval 5        # Update status bar every 5 seconds (default is 15)

# Better colors and terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # True color support
set -g status-right ''

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ============================================
# KEY BINDINGS
# ============================================
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Window switching
bind -n M-Left select-window -t :-
bind -n M-Right select-window -t :+

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (vim-style)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick pane switching with Alt+arrow (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ============================================
# COPY MODE (VI-STYLE)
# ============================================
# Use vim keybindings in copy mode
setw -g mode-keys vi

# Enter copy mode with prefix + [
bind [ copy-mode

# Always support tmux's own buffer, including headless/SSH sessions.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind ] paste-buffer

set -g set-clipboard on

# ============================================
# MOUSE SUPPORT
# ============================================
# Smooth scrolling with mouse wheel
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M

# Faster scrolling with Ctrl+Wheel
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# ============================================
# STATUS BAR
# ============================================
# Dark blue bar with white text
set -g status-style "bg=#1a2b4a,fg=white"

# Window list: inactive windows
setw -g window-status-format " #I:#W "
setw -g window-status-style "bg=#1a2b4a,fg=#aabbcc"

# Window list: active window — lighter blue highlight
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=#3a7bd5,fg=white,bold"

# Separator between windows
setw -g window-status-separator "|"

# Left/right status content
set -g status-left ""
set -g status-right "#[fg=white,bg=#1a2b4a] %H:%M "
#set -g status-right "#[fg=white,bg=#1a2b4a] "

set -g detach-on-destroy off

# Aggressive resize (useful for multi-monitor)
setw -g aggressive-resize on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Allow terminal scrolling
set -ga terminal-overrides ',*256col*:smcup@:rmcup@'
